<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>사각형 공방 · 여러 가지 사각형</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1d2129;--sub:#5d636b;--line:#e4dfd4;--perp:#e5484d;--par1:#2f6fed;--par2:#13976a;--eq:#e08600;--acc:#5b3fd0;--acc-soft:#efe9ff;--ok:#13976a;--no:#d64545}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
body.teacher{font-size:21px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
a{color:inherit}
h1{font-size:1.65em;line-height:1.25;margin:.15em 0;letter-spacing:-.02em}
.lead{color:var(--sub);margin:.2em 0 1em}
.sub{color:var(--sub);font-size:.92em;margin:8px 2px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;text-decoration:none;margin-right:8px;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{border:0;background:none;padding:9px 13px;border-radius:12px;color:var(--sub);white-space:nowrap;font-weight:700;font-size:.95em}
.tab.on{background:var(--ink);color:#fff}
.who{margin-left:auto;color:var(--sub);font-size:.8em;white-space:nowrap;padding-left:8px}
.wrap{max-width:1280px;margin:0 auto;padding:18px 18px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.btn{border:0;border-radius:14px;padding:11px 20px;background:var(--ink);color:#fff;font-weight:700;min-height:50px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.acc{background:var(--acc)}
.btn.big{font-size:1.12em;padding:14px 26px;min-height:58px}
.btn.sm{min-height:42px;padding:8px 14px;font-size:.9em}
.btn:disabled{opacity:.35}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.center{justify-content:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.board{display:block;width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.board-card{padding:6px}
.board-card .board{max-height:calc(100vh - 120px)}
.gap-top{margin-top:12px}
.info{display:flex;flex-direction:column;gap:8px;margin:4px 0 10px}
.badge{padding:10px 14px;border-radius:12px;border:1.5px solid;font-weight:600}
.badge b{font-weight:800}
.badge.par{border-color:#c6d6fb;background:#f1f5ff}
.badge.perp{border-color:#f5c6c7;background:#fff3f3}
.badge.eq{border-color:#f3d6a2;background:#fff8ec}
.name-box{font-size:1.55em;font-weight:800;padding:12px 16px;border-radius:14px;background:var(--acc-soft);color:var(--acc);line-height:1.3}
.name-box small{display:block;font-size:.5em;font-weight:600;color:var(--sub);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--sub);font-size:.85em;margin-top:6px}
.lg{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg.r{background:var(--perp)}.lg.b{background:var(--par1)}.lg.g{background:var(--par2);margin-left:-3px}.lg.o{background:var(--eq)}
.fb{padding:13px 16px;border-radius:14px;margin:10px 0;font-weight:600}
.fb.ok{background:#e5f5ee;color:#0b6646}
.fb.no{background:#fdeeee;color:#a32b2b}
.fb.tip{background:#fff5d8;color:#6f5200}
.checks{margin:8px 0 4px;padding:0;list-style:none}
.checks li{margin:2px 0}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* home */
body.home{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 15% 10%,#ebe4ff,transparent 45%),radial-gradient(circle at 90% 90%,#e3eeff,transparent 40%),var(--bg)}
.home-card{max-width:760px;padding:30px 22px;text-align:center}
.kicker{color:var(--acc);font-weight:800}
.home-card h1{font-size:3em;margin:.15em 0}
.home-btns{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.hbig{display:block;text-decoration:none;background:#fff;border:2px solid var(--ink);border-radius:22px;padding:28px 18px;font-size:1.4em;font-weight:800}
.hbig small{display:block;font-size:.6em;color:var(--sub);font-weight:600;margin-top:6px}
/* twenty */
.cands{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin:12px 0 18px}
@media (max-width:1100px){.cands{grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 12px}.cand{padding:6px}.cand-svg{width:auto;height:min(8vh,80px);margin:0 auto}.cand.back{aspect-ratio:auto;height:calc(min(8vh,80px) + 42px)}.tq{min-height:64px;padding:6px}}
.cand{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center;transition:all .6s}
.cand:disabled{opacity:1;cursor:default}
.cand-svg{width:100%;display:block}
.cand-svg *{fill:var(--acc-soft);stroke:var(--acc);stroke-width:3;stroke-linejoin:round}
.cand-l{font-weight:800;margin-top:6px;font-size:.9em;white-space:nowrap}
.cand.out{opacity:.22;transform:scale(.9);filter:grayscale(1)}
.cand.out::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4em;color:var(--no);font-weight:900}
.cand.win{border-color:var(--acc);box-shadow:0 0 0 6px var(--acc-soft);transform:scale(1.06)}
.cand.back{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1.2;font-size:2.6em;font-weight:900;color:var(--acc);background:var(--acc-soft);border-style:dashed}
.tqs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.tqs{grid-template-columns:repeat(2,1fr)}}
.tq{border:2px solid var(--ink);background:#fff;border-radius:18px;padding:12px;font-size:1.05em;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:96px}
.tq small{font-size:.72em;font-weight:700;color:var(--sub)}
.tq.used{background:var(--ink);color:#fff}
.tq.used small{color:#b9bcc2}
.tq:disabled:not(.used){opacity:.35}
.tq-a{font-size:.95em;color:#ffd166}
.tq-a.no{color:#ffa3a3}
.tw-status{text-align:center;font-size:1.3em;font-weight:800;margin:18px 0 4px}
.secret{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:26px;align-items:center;margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}
@media (max-width:900px){.secret{grid-template-columns:1fr}}
.secret-fig svg{width:100%;display:block}
.ext{stroke:var(--par1);stroke-width:.05;stroke-dasharray:.16 .12}
.sec-item{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;animation:pop .5s both}
.s1{animation-delay:.1s}.s2{animation-delay:.7s}.s3{animation-delay:1.3s}.s4{animation-delay:1.8s}
.dot{width:18px;height:18px;border-radius:50%;flex:none;margin-top:6px}
.dot.red{background:var(--perp)}.dot.blue{background:var(--par1)}
b.red{color:var(--perp)} b.blue{color:var(--par1)}
.goal{background:var(--acc-soft);border-radius:16px;padding:14px 18px;margin:8px 0;animation:pop .5s both}
.teaser{color:var(--sub);margin-top:8px;animation:pop .5s both}
/* table */
.ftable{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.ftable th,.ftable td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.ftable tr:last-child td{border-bottom:0}
.ftable th{background:#faf8f3;font-size:.85em;color:var(--sub)}
.ftable tr.start td{background:#fbfaff}
.nm-in{display:flex;align-items:center;gap:12px;font-weight:800;text-align:left}
.nm-in svg{width:110px;height:76px;flex:none}
.nm-in small{display:block;font-size:.7em;color:var(--acc);font-weight:700}
.cell{border:2px dashed #cfc7b6;background:#fffdf8;border-radius:12px;padding:10px 12px;min-width:120px;width:100%;font-weight:800;color:var(--sub)}
.cell.rev{border:2px solid transparent;background:var(--acc-soft);color:var(--ink)}
.cell:disabled{opacity:1;color:var(--ink)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
.chain .c{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:7px 16px;font-weight:800}
.chain .arr{color:var(--sub);font-size:.85em;font-weight:700}
.chain .new{animation:pop .5s both}
.concl{font-weight:800;font-size:1.08em;margin:14px 2px 4px;animation:pop .5s both}
/* 선생님 아래쪽 단추 줄 */
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tbar-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;min-width:0}
body.teacher .wrap{padding-bottom:120px}
body.teacher .board-card .board{max-height:calc(100vh - 260px)}
.net{font-size:.78em;font-weight:700;color:var(--sub);white-space:nowrap}
.net.on{color:var(--ok)}
.kdots{font-size:1.05em;display:inline-flex;gap:4px;align-items:center}
.av{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-weight:800;font-size:.9em;line-height:1;vertical-align:middle}
.role .em .av,.kid-em .av{font-size:.75em}
.ndot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#c9c3b6;margin-left:6px;vertical-align:1px}
.ndot.on{background:var(--ok)}
.ndot.bad{background:var(--eq)}
.net.bad{color:#a05a00}
button.who{border:0;background:none;font-weight:700}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);transition:transform .35s;z-index:50;background:var(--ink);color:#fff;border-radius:20px;padding:16px 26px;font-weight:800;font-size:1.15em;line-height:1.5;box-shadow:0 12px 34px rgba(0,0,0,.28);width:max-content;max-width:min(92vw,820px);text-align:center;cursor:pointer}
#toast.on{transform:translate(-50%,0)}
/* 공방 작업 순서 */
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:9px 12px}
.step.done{border-color:#bfe6d4;background:#f1faf6}
.st-em{font-size:1.6em;flex:none}
.step>div{flex:1;min-width:0}
.step .sub{margin:2px 0 0}
.st-ok{font-size:1.2em;flex:none}
.mini{display:block;width:140px;margin-top:4px}
.mini svg{width:100%;display:block;background:#fff;border-radius:8px}
.sbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sbox .stars{flex:1;min-width:120px}
/* 학생 현황 */
.kids{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:800px){.kids{grid-template-columns:1fr}}
.kid.off{opacity:.55}
.kid-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.kid-em{font-size:2.4em}
.kid-h .sub{margin:0 0 0 auto;text-align:right;font-size:.8em}
.kid-l{list-style:none;margin:0;padding:0}
.kid-l li{padding:9px 4px;border-top:1px solid var(--line)}
.kid-l li b{float:right}
.self{color:var(--acc);font-weight:700;margin-top:2px}
.stc{color:#f2a900}
/* 학생 공방 */
.role .num{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;width:1.8em;height:1.8em;line-height:1.8em;font-weight:800}
.todo{background:#fff8ec;border:1.5px solid #f3d6a2;border-radius:14px;padding:10px 16px;margin:10px 0;font-weight:600}
.todo ol{margin:2px 0 0;padding-left:1.4em}
.follow{font-weight:800;color:var(--acc)}
.cap{text-align:center;font-weight:800;color:var(--sub);margin:4px 0 2px}
.wait{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--sub);font-weight:700}
/* shop */
.shop{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.shop{grid-template-columns:1fr}}
.order{text-align:center;padding:24px}
.who-em{font-size:5em;line-height:1.1}
.cust{display:block;margin:0 auto;width:190px;height:190px;object-fit:contain}
.cust.sm{display:inline-block;width:72px;height:72px;margin:0}
.cust.xs{display:inline-block;width:1.8em;height:1.8em;vertical-align:middle;margin:0}
.who-name{color:var(--sub);font-weight:800;margin:6px 0 12px}
.bubble{background:var(--ink);color:#fff;border-radius:22px;padding:20px 24px;font-size:1.25em;font-weight:700;text-align:left;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700}
.ic{display:inline-block;min-width:1.4em;color:var(--acc);font-weight:900;margin-right:4px}
.onum{display:flex;gap:8px;flex-wrap:wrap}
.onum button{width:54px;height:54px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:1.1em}
.onum button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.onum button:disabled{opacity:.35}
.stars{font-size:1.6em;min-height:1.6em;letter-spacing:2px}
.timer{font-size:2em;font-weight:800;font-variant-numeric:tabular-nums;min-width:3.2em}
.stars .sub{font-size:.55em;letter-spacing:0}
.ans{margin-top:14px;animation:pop .4s both}
.ans-fig svg{width:100%;max-height:300px;display:block}
/* student */
.mission-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 15px;font-weight:800;min-height:50px}
.mt .st-s{color:#f2a900}
.mt.on{border-color:var(--ink);background:var(--ink);color:#fff}
.mt.done::after{content:' ✓';color:var(--ok)}
.mt.on.done::after{color:#8ff0c6}
.mission{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.m-text{flex:1;margin:0;font-size:1.22em;font-weight:700}
.say{border:0;background:var(--acc-soft);border-radius:12px;width:52px;height:52px;font-size:1.35em;flex:none}
.who-sm{font-size:2.4em;flex:none}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:700px){.roles{grid-template-columns:1fr}}
.role{border:2px solid var(--line);background:#fff;border-radius:20px;padding:22px 14px;text-align:center}
.role .em{font-size:3em}
.rimg{display:block;width:120px;height:120px;object-fit:contain;margin:0 auto}
.rimg.xs{display:inline-block;width:1.6em;height:1.6em;margin:0 2px;vertical-align:middle}
.role-tag .rimg{display:inline-block;width:56px;height:56px;vertical-align:middle;margin-right:4px}
.st-em .rimg{width:56px;height:56px}
.role b{display:block;font-size:1.2em;margin:6px 0}
.role span{color:var(--sub);font-size:.9em}
.role-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role-tag{font-size:1.25em;font-weight:800}
.words{flex:1;font-size:1.38em;font-weight:700;line-height:2}
.w{border:0;background:none;padding:2px 2px;border-radius:6px;font-weight:700}
.w.hl{background:linear-gradient(transparent 55%,#ffe066 55%)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.pchip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 15px;font-weight:700;min-height:52px}
.pchip.sel{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.pchip.good{border-color:var(--ok);background:#e5f5ee;color:#0b6646}
.pchip.miss{border-style:dashed;border-color:var(--eq);background:#fff8ec}
.pchip.bad{border-color:var(--no);background:#fdeeee;color:#a32b2b}
.qblock{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.qblock h3{margin:0 0 10px;font-size:1.08em}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.col{flex-direction:column;align-items:stretch;margin-top:12px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 16px;font-weight:700;min-height:52px;text-align:left}
.opt.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.opt.sel-ok,.pic.sel-ok{border-color:var(--ok);background:#e5f5ee;color:#0b6646}
.opt.sel-no,.pic.sel-no{border-color:var(--no);background:#fdeeee;color:#a32b2b}
.picgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.picgrid.three{grid-template-columns:repeat(3,1fr)}
.pic{border:3px solid var(--line);background:#fff;border-radius:18px;padding:8px}
.pic svg{width:100%;height:auto;display:block}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;width:100%}
.keypad button{height:60px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:1.4em;font-weight:800}
.kp-wrap{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
.numline{font-size:1.3em;font-weight:800;margin:12px 0 4px}
.numbox{font-size:1.6em;font-weight:800;border-bottom:3px solid var(--ink);min-width:3ch;display:inline-block;text-align:center;margin-right:6px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:700px){.levels{grid-template-columns:1fr}}
.lvl{border:2px solid var(--line);background:#fff;border-radius:20px;padding:24px 14px;text-align:center}
.lvl .st{font-size:1.8em;color:#f2a900;letter-spacing:2px}
.lvl b{display:block;font-size:1.15em;margin:6px 0}
.lvl span{color:var(--sub);font-size:.9em}
.prog{color:var(--sub);font-weight:800}
.qfig{max-width:420px;margin:12px auto 0}
.qfig svg{width:100%;display:block}
.fin{text-align:center;max-width:720px;margin:0 auto}
.fin .opts{justify-content:center}
.big-st{font-size:2.4em;color:#f2a900;letter-spacing:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- 기본 도구 ---------- */
const NS='http://www.w3.org/2000/svg';
const C={perp:'#e5484d',par1:'#2f6fed',par2:'#13976a',eq:'#e08600',acc:'#5b3fd0',ink:'#1d2129'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const setHTML=(id,h)=>{const e=document.getElementById(id);if(e)e.innerHTML=h;};
const f=n=>Math.round(n*1000)/1000;
const pts=a=>a.map(p=>Array.isArray(p)?{x:p[0],y:p[1]}:{x:p.x,y:p.y});
const clone=P=>P.map(p=>({x:p.x,y:p.y}));
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y});
const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y});
const cross=(u,v)=>u.x*v.y-u.y*v.x;
const dot=(u,v)=>u.x*v.x+u.y*v.y;
const len2=u=>u.x*u.x+u.y*u.y;
const eqp=(a,b)=>a.x===b.x&&a.y===b.y;
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

function send(d){

function orient(a,b,c){return Math.sign(cross(sub(b,a),sub(c,a)));}
function onSeg(a,b,c){return Math.min(a.x,b.x)<=c.x&&c.x<=Math.max(a.x,b.x)&&Math.min(a.y,b.y)<=c.y&&c.y<=Math.max(a.y,b.y);}
function segCross(p1,p2,p3,p4){
  const d1=orient(p3,p4,p1),d2=orient(p3,p4,p2),d3=orient(p1,p2,p3),d4=orient(p1,p2,p4);
  if(d1*d2<0&&d3*d4<0)return true;
  return (d1===0&&onSeg(p3,p4,p1))||(d2===0&&onSeg(p3,p4,p2))||(d3===0&&onSeg(p1,p2,p3))||(d4===0&&onSeg(p1,p2,p4));
}
function analyze(P){
  const S=[0,1,2,3].map(i=>sub(P[(i+1)%4],P[i]));
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)if(eqp(P[i],P[j]))return{ok:false,msg:'꼭짓점 두 개가 같은 점에 있어요.'};
  for(let i=0;i<4;i++)if(cross(S[i],S[(i+1)%4])===0)return{ok:false,msg:'꼭짓점 세 개가 한 줄에 있어요. 사각형이 아니에요!'};
  if(segCross(P[0],P[1],P[2],P[3])||segCross(P[1],P[2],P[3],P[0]))return{ok:false,msg:'변이 서로 엇갈렸어요. 꼭짓점을 다시 옮겨 보세요.'};
  const parA=cross(S[0],S[2])===0,parB=cross(S[1],S[3])===0,par=(parA?1:0)+(parB?1:0);
  const rightAt=[0,1,2,3].map(i=>dot(S[(i+3)%4],S[i])===0),right=rightAt.filter(Boolean).length;
  const L=S.map(len2),allEq=L.every(v=>v===L[0]),oppEq=L[0]===L[2]&&L[1]===L[3];
  let name;
  if(par===2)name=right===4?(allEq?'정사각형':'직사각형'):(allEq?'마름모':'평행사변형');
  else name=par===1?'사다리꼴':'사각형';
  return{ok:true,S,L,parA,parB,par,rightAt,right,allEq,oppEq,name};
}

function chev(m,d,n,col){

  for(let k=0;k<n;k++){const o=(k-(n-1)/2)*.2,c={x:m.x+u.x*o,y:m.y+u.y*o};

  return s;
}
function rmark(V,A,B,a){

  const p1={x:V.x+u.x*a,y:V.y+u.y*a},p3={x:V.x+w.x*a,y:V.y+w.y*a},p2={x:p1.x+w.x*a,y:p1.y+w.y*a};

}
function ticks(a,b,n){
  const d=sub(b,a),u=unit(d),q={x:-u.y,y:u.x},c={x:a.x+d.x*.27,y:a.y+d.y*.27};let s='';
  for(let k=0;k<n;k++){const o=(k-(n-1)/2)*.1,p={x:c.x+u.x*o,y:c.y+u.y*o};
    s+=`<line x1="${f(p.x+q.x*.16)}" y1="${f(p.y+q.y*.16)}" x2="${f(p.x-q.x*.16)}" y2="${f(p.y-q.y*.16)}" stroke="${C.eq}" stroke-width=".065" stroke-linecap="round"/>`;}

function quadSVG(P,an,o){
  o=o||{};const marks=!!o.marks&&an.ok;
  let s=`<polygon points="${P.map(p=>p.x+','+p.y).join(' ')}" fill="rgba(91,63,208,.10)"/>`;
  for(let i=0;i<4;i++){const a=P[i],b=P[(i+1)%4];let col=C.ink;
    if(marks){if(i%2===0&&an.parA)col=C.par1;if(i%2===1&&an.parB)col=C.par2;}
    s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width=".09" stroke-linecap="round"/>`;}
  if(marks){
    [[0,an.parA,1,C.par1],[1,an.parB,2,C.par2]].forEach(([i,on,n,col])=>{if(!on)return;const ref=an.S[i];
      [i,i+2].forEach(k=>{let d=an.S[k];if(dot(d,ref)<0)d={x:-d.x,y:-d.y};s+=chev(mid(P[k],P[(k+1)%4]),d,n,col);});});

    let n=0;Object.values(g).filter(a=>a.length>1).forEach(arr=>{n++;arr.forEach(k=>{s+=ticks(P[k],P[(k+1)%4],n);});});

function labelsSVG(P,labels,fixed){

  P.forEach((a,i)=>{const b=P[(i+1)%4],m=mid(a,b),u=unit(sub(b,a));let n={x:-u.y,y:u.x};if(dot(n,sub(m,c))<0)n={x:-n.x,y:-n.y};
    const t={x:m.x+n.x*.62,y:m.y+n.y*.62},v=labels[i];

    else s+=`<circle cx="${f(t.x)}" cy="${f(t.y)}" r=".34" fill="${C.acc}" opacity=".14"/><text x="${f(t.x)}" y="${f(t.y)}" font-size=".46" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="${C.acc}">?</text>`;});

}
function longLine(a,b,col,sw,dash){const d=sub(b,a);return `<line x1="${f(a.x-d.x*40)}" y1="${f(a.y-d.y*40)}" x2="${f(a.x+d.x*40)}" y2="${f(a.y+d.y*40)}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"${dash?' stroke-dasharray=".2 .15" opacity=".6"':''}/>`;}
function lineX(a,b,c,d){const r=sub(b,a),s=sub(d,c),den=cross(r,s);if(!den)return null;const t=cross(sub(c,a),s)/den;return{x:a.x+r.x*t,y:a.y+r.y*t};}

  if(ua&&ub){s+=longLine(ua,ub,C.par1,.05,true);s+=`<line x1="${ua.x}" y1="${ua.y}" x2="${ub.x}" y2="${ub.y}" stroke="${C.par1}" stroke-width=".11" stroke-linecap="round"/>`;}

class Board{
  constructor(o){
    Object.assign(this,{cols:11,rows:8,mode:'quad',showMarks:true,locked:false,onChange:null,checked:false,ua:null,ub:null},o);
    if(this.P)this.P=pts(this.P);
    if(this.labels)this.labels=this.labels.slice();
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox',`-0.7 -0.7 ${this.cols+.4} ${this.rows+.4}`);
    svg.setAttribute('class','board');
    this.svg=svg;this.drag=null;
    svg.addEventListener('pointerdown',e=>this.down(e));
    svg.addEventListener('pointermove',e=>this.move(e));
    ['pointerup','pointercancel','lostpointercapture'].forEach(t=>svg.addEventListener(t,()=>{this.drag=null;}));
    this.render();
  }
  pt(e){const p=this.svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(this.svg.getScreenCTM().inverse());}
  snap(p){return{x:Math.max(0,Math.min(this.cols-1,Math.round(p.x))),y:Math.max(0,Math.min(this.rows-1,Math.round(p.y)))};}
  changed(){if(this.onChange)this.onChange(this);}
  down(e){
    if(this.locked)return;
    lockH();
    const p=this.pt(e);
    if(this.mode==='quad'){
      let best=-1,bd=.75*.75;
      this.P.forEach((q,i)=>{const d=(q.x-p.x)**2+(q.y-p.y)**2;if(d<bd){bd=d;best=i;}});
      if(best<0)return;
      this.drag=best;e.preventDefault();
      try{this.svg.setPointerCapture(e.pointerId);}catch(_){}
    }else if(this.mode==='line'){
      const s=this.snap(p);if((s.x-p.x)**2+(s.y-p.y)**2>.45*.45)return;
      if(!this.ua||this.ub){this.ua=s;this.ub=null;}else if(!eqp(s,this.ua))this.ub=s;else return;
      this.checked=false;this.render();this.changed();
    }else if(this.mode==='label'){
      let best=-1,bd=.8;
      this.P.forEach((a,i)=>{const d=distSeg(p,a,this.P[(i+1)%4]);if(d<bd){bd=d;best=i;}});
      if(best<0||this.fixed[best])return;
      this.labels[best]=this.labels[best]?'':this.val;this.render();this.changed();
    }
  }
  move(e){
    if(this.drag==null)return;
    const s=this.snap(this.pt(e)),cur=this.P[this.drag];
    if(eqp(s,cur)||this.P.some((q,i)=>i!==this.drag&&eqp(q,s)))return;
    this.P[this.drag]=s;this.checked=false;this.render();this.changed();
  }
  render(){
    let s='';
    for(let y=0;y<this.rows;y++)for(let x=0;x<this.cols;x++)s+=`<circle cx="${x}" cy="${y}" r=".075" fill="#b8b0a0"/>`;
    if(this.mode==='quad'){
      this.an=analyze(this.P);
      s+=quadSVG(this.P,this.an,{marks:this.showMarks});
      if(!this.locked)this.P.forEach(p=>{s+=`<circle cx="${p.x}" cy="${p.y}" r=".26" fill="#fff" stroke="${C.acc}" stroke-width=".08"/>`;});
    }else if(this.mode==='line'){
      s+=lineSVG(this.given,this.ua,this.ub,this.checked?lineCheck(this.given,this.ua,this.ub).kind:null);
    }else{
      this.an=analyze(this.P);
      s+=quadSVG(this.P,this.an,{marks:false})+labelsSVG(this.P,this.labels,this.fixed);
    }
    this.svg.innerHTML=s;
  }
}
function lockH(){const b=document.body,h=document.documentElement.scrollHeight;if((parseFloat(b.style.minHeight)||0)<h)b.style.minHeight=h+'px';}

function distSeg(p,a,b){const ab=sub(b,a),ap=sub(p,a);let t=dot(ap,ab)/len2(ab);t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-(a.x+ab.x*t),p.y-(a.y+ab.y*t));}

function boardSnap(){const o={};Object.keys(BOARDS).forEach(k=>{if(k==='tdemo')return;const b=BOARDS[k];o[k]={P:b.P?b.P.map(p=>[p.x,p.y]):null,ua:b.ua,ub:b.ub,labels:b.labels||null};});return Object.assign({},SAVEDB,o);}
function loadState(){
  const get=k=>{try{const v=JSON.parse(localStorage.getItem(SKEY+k));return v&&Date.now()-v.ts<6*3600e3?v:null;}catch(_){return null;}};
  const t=get('t');if(t)try{const T=ST.t;Object.assign(T,{tab:t.tab||T.tab,tw:t.tw||T.tw,demo:t.demo||T.demo,table:t.table||T.table,kids:t.kids||{},ep:t.ep||T.ep});Object.assign(T.shop,t.shop||{});}catch(_){}
  const s=get('s');if(s)try{const S=ST.s;Object.assign(S,{tab:STABS.includes(s.tab)?s.tab:'lines',quiz:s.quiz||S.quiz,qres:s.qres||{},ep:s.ep||null,ots:s.ots||0});SAVEDB=s.boards||{};
    Object.assign(S.lines,s.lines||{});Object.assign(S.morph,s.morph||{});Object.assign(S.shop,s.shop||{});S.shop.st=S.shop.st||{};S.shop.recv=S.shop.recv||{};Object.values(S.shop.st).forEach(x=>{if(x&&x.sending){delete x.sending;if(x.sent===1)x.sent=0;}});if(S.quiz&&S.quiz.net==='sending')S.quiz.net='fail';}catch(_){}
}

function sst(role){const S=ST.s.shop,k=role+S.i;return S.st[k]||(S.st[k]={});}
function busy(){return Object.values(BOARDS).some(b=>b.drag!=null);}

let snapT=0;
function sendSnap(hello,delay,cb){
  const S=ST.s;if(!S.me||location.hash!=='#s')return;
  clearTimeout(snapT);
  snapT=setTimeout(()=>{send({t:'snap',me:S.me,ep:S.ep,hello:hello?1:0,tab:S.tab,lines:Object.keys(S.lines.done).map(Number),morph:Object.keys(S.morph.done).map(Number),quiz:S.qres}).then(g=>{if(cb)cb(g);});},delay||(hello?50:700));
}
function shapeOf(o,b){
  if(o.type==='quad')return{P:b.P.map(p=>[p.x,p.y])};
  if(o.type==='line')return{ua:b.ua,ub:b.ub};
  return{labels:b.labels.slice()};
}
function cleanShape(o,d){
  if(o.type==='quad'){const P=Array.isArray(d.P)&&d.P.length===4?pts(d.P):null;return P&&P.every(okXY)?{P}:null;}
  if(o.type==='line')return okXY(d.ua)&&okXY(d.ub)?{ua:{x:d.ua.x,y:d.ua.y},ub:{x:d.ub.x,y:d.ub.y}}:null;
  return Array.isArray(d.labels)&&d.labels.length===4?{labels:d.labels.map(v=>v?'5cm':'')}:null;
}
function shapeFig(o,sh){
  if(o.type==='quad')return figSVG(sh.P,{box:[-.6,-.6,11.2,8.2]});
  if(o.type==='line')return figLinesSVG(o.given,{a:sh.ua,b:sh.ub},{cols:11,rows:8});
  return figSVG(VIP_P,{labels:sh.labels,grid:false,pad:1.2});
}
/* 학생: 선생님 메시지의 수업 번호(ep)·공방 번호(sep)를 맞춘다. 옛 메시지면 null, 기록을 지웠으면 true */
function stuSync(d){
  const S=ST.s;
  if(typeof d.ts==='number'&&S.ots&&d.ts<S.ots)return null;
  let re=false;
  if(typeof d.ep==='string'){if(S.ep&&S.ep!==d.ep){Object.assign(S,newS(S.me));dropBoards('');SAVEDB={};re=true;}S.ep=d.ep;}
  if(typeof d.sep==='string'){if(S.shop.sep&&S.shop.sep!==d.sep&&!re){Object.assign(S.shop,{i:0,st:{},recv:{}});dropBoards('build');SAVEDB={};re=true;}S.shop.sep=d.sep;}
  if(typeof d.ts==='number')S.ots=d.ts;
  return re;
}
function onNet(d){
  const r=location.hash;
  if(r==='#t'){
    const T=ST.t;
    if(d.t==='snap'&&AV[d.me]){
      const q={};[1,2,3].forEach(l=>{const x=d.quiz&&d.quiz[l];if(x&&Number.isInteger(x.n))q[l]={n:Math.max(0,Math.min(x.n,QUIZ[l].qs.length)),of:QUIZ[l].qs.length,self:SELF.includes(x.self)?x.self:null};});
      const arr=(a,max)=>Array.isArray(a)?a.filter(n=>okI(n,max)):[];
      if(d.ep&&d.ep!==T.ep){sendOrder(true);return;}
      const old=d.ep===T.ep?T.kids[d.me]:null,uni=(a,b)=>[...new Set([...(a||[]),...b])].sort();
      T.kids[d.me]={tab:STABS.includes(d.tab)?d.tab:'',lines:uni(old&&old.lines,arr(d.lines,LINE_M.length)),morph:uni(old&&old.morph,arr(d.morph,MORPH_M.length)),quiz:Object.assign({},old&&old.quiz,q)};
      if(d.hello||d.ep!==T.ep)sendOrder(true);
      saveState();
      setHTML('tbar-kids',kidDots());
      if(T.tab==='kids')softRender();
    }
    if(d.t==='shop'&&okI(d.i,ORDERS.length)&&AV[d.me]){
      const o=ORDERS[d.i],P=T.shop.prog[d.i]||(T.shop.prog[d.i]={}),tag=`${avc(d.me)}번`;
      if(d.step==='read'&&!P.read){P.read={me:d.me};}
      else if(d.step==='build'){if(d.sep&&d.sep!==T.shop.sep)return;const sh=cleanShape(o,d);if(!sh)return;P.build={me:d.me,sh};if(!P.deliver)ding('ok');}
      else if(d.step==='deliver'&&!P.deliver){if(d.sep&&d.sep!==T.shop.sep)return;
        const name=o.type==='quad'?(o.ins.accept.includes(d.name)?d.name:o.ins.name):o.answer.name;
        P.deliver={me:d.me,name};T.shop.stars++;ding('bell');
        toast(`📦 납품 도착! 주문 ${d.i+1} · ${custImg(o,'cust xs')} ${o.name}<br>${tag} 검사관: <b>${esc(name)}</b> · ⭐ 하나 받았어요`,8000);
      }else return;
      saveState();if(T.tab==='shop')softRender();
    }
  }else if(r==='#s'){
    const S=ST.s;
    if(d.t==='order'&&okI(d.i,ORDERS.length)){
      const re=stuSync(d);if(re===null)return;
      if(S.shop.i!==d.i||re){S.shop.i=d.i;softRender();}
      if(re)sendSnap();saveState();}
    else if(d.t==='go'&&STABS.includes(d.tab)){
      const re=stuSync(d);if(re===null)return;
      S.tab=d.tab;if(d.tab==='shop'&&okI(d.i,ORDERS.length))S.shop.i=d.i;ding('bell');softRender();scrollTo(0,0);if(re)sendSnap();saveState();}
    else if(d.t==='who')sendSnap();
    else if(d.t==='shop'&&d.step==='build'&&okI(d.i,ORDERS.length)){
      if(d.sep&&S.shop.sep&&d.sep!==S.shop.sep)return;
      const sh=cleanShape(ORDERS[d.i],d);if(!sh)return;S.shop.recv[d.i]=sh;saveState();
      if(S.tab==='shop'&&S.shop.role==='check'&&S.shop.i===d.i){ding('ok');softRender();}
    }
  }
}

function timerStars(){
  const S=ST.t.shop;

  <div class="sbox" style="margin-top:8px"><div class="stars">${'⭐'.repeat(S.stars)||'<span class="sub">우리 팀 별 · 아직 없어요</span>'}</div><button class="btn sm" data-act="tStar" data-d="1">⭐ 주기</button><button class="btn ghost sm" data-act="tStar" data-d="-1">빼기</button></div></div>`;
}
function shopSteps(i){
  const P=ST.t.shop.prog[i]||{},o=ORDERS[i],who=d=>`${avc(d.me)}번`;
  const row=(k,em,title,todo,done)=>`<li class="step ${P[k]?'done':''}"><span class="st-em">${em}</span><div><b>${title}</b><div class="sub">${P[k]?done(P[k]):todo}</div></div><span class="st-ok">${P[k]?'✅':'⏳'}</span></li>`;
  return `<div class="card gap-top"><b>작업 순서</b> <span class="sub">${NET.on?'· 학생이 끝내면 여기에 바로 떠요':'· 연결이 안 되면 학생이 손을 들어 알려요'}</span><ol class="steps">
  ${row('read',RB('read'),'1. 주문서 담당 · 조건 찾기','주문을 읽고 조건에 밑줄을 그어 만들기 담당에게 말해요',d=>`${who(d)} 조건을 찾았어요 · ${o.conds.map(k=>COND[k][1]).join(', ')}`)}
  ${row('build',RB('build'),'2. 만들기 담당 · 점판에 만들기','들은 조건대로 선을 긋거나 사각형을 만들어요',d=>`${who(d)} 다 만들었어요<span class="mini">${shapeFig(o,d.sh)}</span>`)}
  ${row('deliver',RB('check'),'3. 검사관 · 검사하고 납품','삼각자로 재어 보고 이름과 이유를 골라 납품해요',d=>`${who(d)} 📦 납품 · <b>${esc(d.name)}</b>`)}
  </ol></div>`;
}
function tKids(){
  const K=ST.t.kids;
  return `<main class="wrap"><h1>확인 문제 · 학생 현황</h1><p class="lead">${NET.on?'학생이 문제를 풀면 결과가 여기에 바로 모여요. 숫자는 한 번에 맞힌 문제 수예요.':'학생 화면과 연결되어 있지 않아요. 학생 아이패드 화면을 직접 확인해 주세요.'}</p>
  <div class="kids">${[1,2,3].map(n=>{const k=K[n];return `<div class="card kid ${k?'':'off'}"><div class="kid-h"><span class="kid-em">${avc(n)}</span><b>${n}번</b><span class="sub">${k?(SNAME[k.tab]||'')+' 하는 중':'아직 연결 안 됨'}</span></div>
  <ul class="kid-l"><li>① 수직·평행 <b>${k?k.lines.length:0} / ${LINE_M.length}</b></li><li>② 변신 사각형 <b>${k?k.morph.length:0} / ${MORPH_M.length}</b></li>
  ${[1,2,3].map(l=>{const q=k&&k.quiz[l];return `<li><span class="stc">${'★'.repeat(l)}</span> ${QUIZ[l].title} <b>${q?`${q.n} / ${q.of}`:'–'}</b>${q&&q.self?`<div class="self">${q.self}</div>`:''}</li>`;}).join('')}</ul></div>`;}).join('')}</div>
  <div class="row gap-top"><button class="btn ghost sm" data-act="tNewClass">🆕 새 수업 시작 (모든 기록 지우기)</button><span class="sub">리허설을 한 뒤, 실제 수업 전에 한 번 눌러요.</span></div></main>`;
}
function answerHTML(o){
  const A=o.answer;let fig;
  if(o.type==='quad')fig=figSVG(A.P,{marks:true});
  else if(o.type==='line')fig=figLinesSVG(o.given,A.line,{cols:11,rows:8,mark:o.target});
  else fig=figSVG(VIP_P,{labels:['5cm','5cm','5cm','5cm'],grid:false,pad:1.2});
  return `<div class="card ans"><div class="ans-fig">${fig}</div><div class="chips">${o.conds.map(condChip).join('')}</div><div class="name-box" style="margin-top:12px">${A.name}</div><p><b>이유</b> · ${A.reason}</p><p class="sub">${A.def}</p></div>`;
}

/* ---------- 학생 화면 ---------- */
function studentView(){
  const S=ST.s,tabs=STABS.map(k=>[k,SNAME[k]]);
  if(!S.me)return topbar('s',tabs,S.tab)+`<main class="wrap"><h1>내 번호를 골라요</h1><p class="lead">선생님이 알려 준 번호를 눌러요. 이 아이패드에서는 한 번만 고르면 돼요.</p>
  <div class="roles">${[1,2,3].map(n=>`<button class="role" data-act="sMeSet" data-k="${n}"><div class="em">${avc(n)}</div><b>${n}번</b></button>`).join('')}</div></main>`;
  return topbar('s',tabs,S.tab)+({lines:sLines,morph:sMorph,shop:sShop,quiz:sQuiz}[S.tab])();
}
function sLines(){
  const S=ST.s.lines,m=LINE_M[S.i];

  <div class="mission"><p class="m-text">${m.text}</p>${sayBtn(m.text)}</div>
  <div class="grid2 gap-top"><div class="card board-card" data-board="sline"></div>
  <div><p class="sub" style="margin-top:0">점 두 개를 차례로 눌러 파란 선을 그어요. 다시 누르면 새로 그려요.</p>
  <div class="row"><button class="btn ghost" data-act="lineClear">지우기</button><button class="btn ghost" data-act="lineHint">💡 힌트</button><button class="btn" data-act="lineCheck">확인</button></div>
  <div id="sline-fb">${S.fb||''}</div></div></div></main>`;
}
function sMorph(){
  const S=ST.s.morph,m=MORPH_M[S.i];

  <div class="row"><button class="btn ghost" data-act="morphReset">정사각형으로</button><button class="btn ghost" data-act="morphMarks">${S.marks?'표시 숨기기':'표시 보기'}</button><button class="btn ghost" data-act="morphHint">💡 힌트</button><button class="btn" data-act="morphCheck">확인</button></div>
  <div id="smorph-fb">${S.fb||''}</div></div></div></main>`;
}
function sShop(){
  const S=ST.s.shop;
  if(!S.role)return `<main class="wrap"><h1>사각형 공방</h1><p class="lead">세 사람이 한 팀이 되어 손님의 주문을 해결해요. 1번 일부터 차례대로 이어서 해요. 내가 맡을 일을 골라요.</p>
  <div class="roles">${ROLES.map((r,i)=>`<button class="role" data-act="sRole" data-k="${r.k}"><span class="num">${i+1}</span><div class="em">${r.em}</div><b>${r.n}</b><span>${r.d}</span></button>`).join('')}</div></main>`;
  const r=ROLES.find(x=>x.k===S.role);
  const todo={read:['주문을 읽고, 조건이 되는 말을 눌러 밑줄을 그어요.','조건을 모두 골라 확인을 눌러요.',RI.build+' 만들기 담당에게 조건을 또박또박 말해 줘요.'],
    build:[RI.read+' 주문서 담당이 말해 준 조건을 눌러 적어 두어요.','점판에 선을 긋거나 사각형을 만들어요.','검사하기를 눌러요. 맞으면 '+RI.check+' 검사관에게 넘어가요.'],
    check:[RI.build+' 만들기 담당이 만든 그림을 삼각자로 재어 봐요.','질문에 답하고, 이름과 이유를 골라요.','📦 납품하기를 눌러요.']}[S.role];
  return `<main class="wrap"><div class="role-bar"><span class="role-tag">${r.em} ${r.n}</span><span class="prog">· 주문 ${S.i+1} ${custImg(ORDERS[S.i],'cust xs')}</span><button class="btn ghost sm" data-act="sRole" data-k="" style="margin-left:auto">역할 바꾸기</button></div>
  <div class="todo">내가 할 일<ol>${todo.map(t=>`<li>${t}</li>`).join('')}</ol></div>
  ${NET.on?'<p class="follow">🔗 주문 번호는 선생님 화면을 따라 바뀌어요.</p>':`<div class="row"><span class="prog">선생님 화면의 주문 번호를 눌러요</span><div class="onum">${ORDERS.map((x,i)=>`<button class="${i===S.i?'on':''}" data-act="sShopGo" data-i="${i}">${i+1}</button>`).join('')}</div></div>`}
  ${({read:sRead,build:sBuild,check:sCheck}[S.role])()}</main>`;
}
function sRead(){
  const o=ORDERS[ST.s.shop.i],st=sst('read');st.hl=st.hl||{};st.sel=st.sel||{};
  const words=o.text.split(' ');
  return `<div class="mission">${custImg(o,'cust sm')}<div class="words">${words.map((w,j)=>`<button class="w ${st.hl[j]?'hl':''}" data-act="wHl" data-j="${j}">${w}</button>`).join(' ')}</div>${sayBtn(o.text)}</div>
  <p class="sub">조건이 되는 말을 눌러 밑줄을 그어요.</p>
  <div class="qblock"><h3>이 주문의 조건을 모두 골라요</h3><div class="pool">${o.pool.map(k=>{let c='';
    if(st.checked){const need=o.conds.includes(k),sel=!!st.sel[k];c=need&&sel?'good':need?'miss':sel?'bad':'';}else if(st.sel[k])c='sel';
    return `<button class="pchip ${c}" data-act="rSel" data-k="${k}">${COND[k][1]}</button>`;}).join('')}</div>
  <div class="row"><button class="btn" data-act="rCheck">확인</button></div><div id="read-fb">${st.fb||''}</div></div>`;
}
function makeBuildBoard(o){
  const clear=bb=>{const st=sst('build');st.fb='';st.base=null;setHTML('build-fb','');if(bb.mode==='quad'&&bb.showMarks){bb.showMarks=false;bb.render();}};
  if(o.type==='quad')return new Board({P:PRESET['정사각형'],showMarks:false,onChange:clear});
  if(o.type==='line')return new Board({mode:'line',given:o.given,onChange:clear});
  return new Board({mode:'label',P:VIP_P,labels:['5cm','','',''],fixed:[true,false,false,false],val:'5cm',onChange:clear});
}
function sBuild(){
  const i=ST.s.shop.i,o=ORDERS[i],st=sst('build');st.memo=st.memo||{};
  board('build'+i,()=>makeBuildBoard(o));
  const guide={line:'점 두 개를 차례로 눌러 파란 선을 그어요.',quad:'동그라미 꼭짓점을 끌어서 사각형을 만들어요.',vip:"물음표(?) 변을 눌러 길이를 채워요. 그림의 한 칸은 1cm예요."}[o.type];
  return `<div class="grid2"><div class="card board-card" data-board="build${i}"></div>
  <div><div class="qblock" style="margin-top:0"><h3>${RI.read} 주문서 담당이 말해 준 조건을 눌러 두세요</h3><div class="pool">${o.pool.map(k=>`<button class="pchip ${st.memo[k]?'sel':''}" data-act="bMemo" data-k="${k}"><span class="ic">${COND[k][0]}</span>${COND[k][1]}</button>`).join('')}</div></div>
  <p class="sub">${guide}</p>
  <div class="row">${o.type!=='vip'?'<button class="btn ghost" data-act="bReset">처음으로</button>':''}${o.hint?'<button class="btn ghost" data-act="bHint">💡 힌트</button>':''}<button class="btn" data-act="bCheck">검사하기</button></div>
  <div id="build-fb">${st.fb||''}</div></div></div>`;
}
function sCheck(){
  const o=ORDERS[ST.s.shop.i],st=sst('check');st.a=st.a||{};
  const opt=(q,title,list)=>`<div class="qblock"><h3>${title}</h3><div class="opts">${list.map(v=>`<button class="opt ${st.a[q]===v?'sel':''}" data-act="cOpt" data-q="${q}" data-v="${esc(v)}">${v}</button>`).join('')}</div></div>`;
  let h='',need;
  if(o.type==='quad'){
    h+='<p class="sub">📐 만들기 담당의 그림을 보고, 삼각자로 직각을 재어 봐요. 마주 보는 변이 평행한지도 살펴봐요.</p>';
    h+=opt('par','① 평행한 변은 몇 쌍인가요?',['0쌍','1쌍','2쌍'])+opt('rt','② 직각은 몇 개인가요?',['0개','1개','2개','3개','4개'])+opt('eq','③ 네 변의 길이가 모두 같나요?',['네','아니요'])
      +opt('name','④ 이 사각형의 이름은?',['사다리꼴','평행사변형','마름모','직사각형','정사각형'])+opt('rs','⑤ 이유 카드를 골라요',[REASON.r1,REASON.r2,REASON.r3,REASON.r4]);
    need=['par','rt','eq','name','rs'];
  }else if(o.type==='line'){
    h+='<p class="sub">📐 만들기 담당이 그은 선을 보고, 삼각자로 재어 봐요.</p>';
    h+=opt('meet','① 두 선은 어떻게 만나나요?',['직각으로 만나요','비스듬히 만나요','만나지 않아요'])+opt('name','② 파란 선의 이름은?',['수선','평행선'])+opt('rs','③ 이유 카드를 골라요',[REASON.l1,REASON.l2]);
    need=['meet','name','rs'];
  }else{
    h+=opt('eq','① 마름모의 네 변의 길이는?',['모두 같아요','모두 달라요']);
    h+=`<div class="qblock"><h3>② 테두리는 모두 몇 cm 필요할까요?</h3><div class="numline"><span class="numbox">${st.num||'&nbsp;'}</span>cm</div>${keypad('check')}</div>`;
    need=['eq'];
  }
  const sh=ST.s.shop.recv[ST.s.shop.i],made=!!sh||st.a.made==='네';
  if(!NET.on)h=opt('made',RI.build+' 만들기 담당 화면에 «🎉 주문대로 만들었어요»가 나왔나요?',['네','아직이에요'])+h;
  const ready=made&&need.every(q=>st.a[q])&&(o.type!=='vip'||st.num);
  h+=`<div class="row"><button class="btn big" data-act="cSubmit" ${ready?'':'disabled'}>📦 납품하기</button></div>${made?'':'<p class="sub">'+RI.build+' 만들기 담당이 주문대로 다 만들어야 납품할 수 있어요.</p>'}<div id="check-fb">${st.fb||''}</div>`;
  if(!NET.on)return h;
  return `<div class="grid2"><div>${sh?`<div class="card board-card">${shapeFig(o,sh)}<div class="cap">${RI.build} 만들기 담당이 보낸 그림</div></div>`
    :`<div class="wait">⏳ 만들기 담당이 아직 그림을 보내지 않았어요.<br>다 만들어서 검사하기를 누르면 여기에 그림이 나타나요.<br>친구 화면을 보고 먼저 답을 골라도 돼요.</div>${st.a.made==='네'?'<p class="sub">✅ 만들기 담당 화면에서 직접 확인했어요.</p>':'<div class="row"><button class="btn ghost sm" data-act="cOpt" data-q="made" data-v="네">그림이 안 와요 · 친구 화면에서 🎉를 직접 봤어요</button></div>'}`}</div><div>${h}</div></div>`;
}
function sQuiz(){
  const Q=ST.s.quiz;
  if(Q.lv==null)return `<main class="wrap"><h1>확인 문제</h1><p class="lead">먼저 연습 문제로 누르는 방법을 익히고, 내가 풀 단계를 골라요.</p>
  <div class="row" style="margin-top:0"><button class="btn acc big" data-act="qLv" data-l="0">✏️ 연습 문제 풀어 보기</button><span class="sub">점수에 들어가지 않아요</span></div>

  const set=QUIZ[Q.lv];
  if(Q.fin&&Q.lv===0)return `<main class="wrap"><div class="card fin"><h1>연습 끝!</h1><p class="lead">이렇게 그림을 누르면 돼요. 이제 내가 풀 단계를 골라요.</p><div class="row center"><button class="btn acc big" data-act="qBack">단계 고르기 →</button></div></div></main>`;
  if(Q.fin){const n=Q.first.filter(Boolean).length;
    return `<main class="wrap"><div class="card fin"><div class="big-st">${'★'.repeat(Q.lv)}</div><h1>${set.title} 끝!</h1><p class="lead">${set.qs.length}문제 중 <b>${n}문제</b>를 한 번에 맞혔어요.</p>
    <div class="qblock"><h3>오늘 수업, 나는?</h3><div class="opts">${SELF.map(s=>`<button class="opt ${Q.self===s?'sel':''}" data-act="qSelf" data-v="${s}">${s}</button>`).join('')}</div>${Q.self?(!NET.on||!Q.net?'<div class="fb ok">좋아요! 선생님께 화면을 보여 주세요.</div>':Q.net==='sending'?'<div class="fb tip">📨 선생님 화면으로 보내는 중이에요…</div>':Q.net==='ok'?'<div class="fb ok">좋아요! 선생님 화면에도 내 결과가 보여요.</div>':'<div class="fb no">⚠️ 선생님 화면에 못 보냈어요. 잠시 뒤 고른 답을 한 번 더 누르거나, 선생님께 화면을 보여 주세요.</div>'):''}</div>
    <div class="row center">${Q.lv<3?`<button class="btn acc big" data-act="qLv" data-l="${Q.lv+1}">${'★'.repeat(Q.lv+1)} 다음 단계 도전 →</button>`:''}<button class="btn ghost" data-act="qBack">단계 고르기</button></div></div></main>`;}
  const q=set.qs[Q.i],cls=j=>Q.sel!==j?'':Q.ok?'sel-ok':'sel-no';
  let choices;
  if(q.type==='pic')choices=`<div class="picgrid">${q.choices.map((P,j)=>`<button class="pic ${cls(j)}" data-act="qPick" data-i="${j}">${figSVG(P,{box:[-.6,-.6,7.2,5.2]})}</button>`).join('')}</div>`;
  else if(q.type==='lines')choices=`<div class="picgrid three">${q.choices.map((l,j)=>`<button class="pic ${cls(j)}" data-act="qPick" data-i="${j}">${figLinesSVG(q.given,l)}</button>`).join('')}</div>`;
  else if(q.type==='text')choices=`<div class="opts col">${q.choices.map((t,j)=>`<button class="opt ${cls(j)}" data-act="qPick" data-i="${j}">${t}</button>`).join('')}</div>`;
  else choices=`<div class="numline"><span class="numbox">${Q.num||'&nbsp;'}</span>${q.unit}</div><div class="kp-wrap">${keypad('quiz')}<button class="btn big" data-act="qNum">확인</button></div>`;
  const fig=q.fig?`<div class="qfig">${figSVG(q.fig.P,q.fig)}</div>`:'';
  let fb='';
  if(Q.ok)fb=`<div class="fb ok">⭕ 정답! ${q.expl}</div><div class="row"><button class="btn big" data-act="qNext">${Q.i+1<set.qs.length?'다음 문제 →':'결과 보기 →'}</button></div>`;
  else if(Q.wrong)fb='<div class="fb no">다시 생각해 봐요.</div>';
  const hint=!Q.ok&&Q.hint?`<div class="fb tip">💡 ${q.hint}</div>`:'';
  return `<main class="wrap"><div class="row" style="margin-top:0"><span class="prog">${'★'.repeat(Q.lv)} ${set.title} · ${Q.i+1} / ${set.qs.length}</span><button class="btn ghost sm" data-act="qBack" style="margin-left:auto">단계 고르기</button></div>
  <div class="mission"><p class="m-text">${q.t}</p>${sayBtn(q.t)}</div>${fig}${choices}
  ${!Q.ok&&!Q.hint?'<div class="row"><button class="btn ghost" data-act="qHint">💡 힌트</button></div>':''}<div id="quiz-fb">${hint}${fb}</div></main>`;
}
/* 검사관 질문 ①②③의 답: 받은 그림이 있으면 그 그림으로, 없으면 주문 조건으로 정해지는 것만 */
function checkExpect(o,sh){
  if(sh&&sh.P){const an=analyze(sh.P);if(an.ok)return{par:an.par+'쌍',rt:an.right+'개',eq:an.allEq?'네':'아니요'};}
  const ex={},c=o.conds;
  if(c.includes('par1')){ex.par='1쌍';ex.eq='아니요';}
  if(c.includes('par2')||c.includes('allEq'))ex.par='2쌍';
  if(c.includes('noRight'))ex.rt='0개';
  if(c.includes('allEq'))ex.eq='네';
  return ex;
}
function judge(Q,ok){
  if(ok){Q.ok=true;Q.first[Q.i]=Q.wrong===0;ding('ok');}
  else{Q.wrong++;Q.hint=true;Q.num='';ding('no');}
  render();seeFb('quiz-fb');
}

  qBack(){ST.s.quiz={lv:null};render();scrollTo(0,0);},
};

/* ---------- 그리기 시작 ---------- */
function render(){
  const r=location.hash.slice(1);
  if(r==='t'||r==='s')netStart();
  document.body.className=r==='t'?'teacher':r==='s'?'student':'home';document.body.style.minHeight='';
  $('#app').innerHTML=r==='t'?teacherView():r==='s'?studentView():homeView();
  document.querySelectorAll('[data-board]').forEach(s=>{const b=BOARDS[s.dataset.board];if(b)s.appendChild(b.svg);});
  saveState();
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(fn)fn(el,e);});
window.addEventListener('hashchange',()=>{render();scrollTo(0,0);});
setInterval(()=>{const S=ST.t.shop;if(!S.run)return;S.tLeft=Math.max(0,Math.ceil((S.tEnd-Date.now())/1000));const el=document.getElementById('tTimer');if(el)el.textContent=fmt(S.tLeft);
  if(S.tLeft===0){S.run=false;ding('bell');if(location.hash==='#t'&&ST.t.tab==='shop')render();}},250);
render();
</script>
</body>
